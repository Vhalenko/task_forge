spring.application.name=taskforge-backend

# DB
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.cache.type=redis

# Hibernate
spring.jpa.hibernate.ddl-auto=update

# Hikari CP
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.initialization-fail-timeout=60000

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

spring.jpa.show-sql=false

# Logs
logging.level.root=INFO
logging.level.com.taskforge=INFO

grafana.loki.url=${GRAFANA_LOKI_URL:http://localhost:3100/loki/api/v1/push}
grafana.loki.user=${GRAFANA_LOKI_USER:}
grafana.loki.token=${GRAFANA_LOKI_TOKEN:}

logging.pattern.level=%5p [%X{requestId:-}] [user=%X{userId:-}]
