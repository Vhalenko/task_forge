spring.application.name=taskforge-backend

# DB
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
app.cache.ttl=PT1M

# Hibernate
spring.jpa.hibernate.ddl-auto=update

# Hikari CP
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.initialization-fail-timeout=60000

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

spring.jpa.show-sql=false

# Logs
logging.level.root=INFO
logging.level.com.taskforge=INFO
logging.pattern.level=%5p [%X{requestId:-}] [user=%X{userId:-}]

# Security
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
