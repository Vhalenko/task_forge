name: TaskForge Backend CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        id: tests
        working-directory: ./backend
        continue-on-error: true
        run: |
          ./mvnw -B -ntp -Dstyle.color=never test \
            > maven-test.log 2>&1

      - name: Show test summary
        if: always()
        working-directory: ./backend
        run: |
          echo "Test summary:"

          if [ -d target/surefire-reports ]; then
            grep -R -h -E \
              "Tests run:.*(Failures: [1-9]|Errors: [1-9])" \
              target/surefire-reports || echo "No failed tests found in reports."
          fi

          if [ "${{ steps.tests.outcome }}" = "failure" ]; then
            echo ""
            echo "Relevant errors:"
            grep -R -n -m 30 -E \
              "Caused by:|Exception:|<failure|<error" \
              target/surefire-reports 2>/dev/null || true

            echo ""
            echo "Last Maven output:"
            tail -n 40 maven-test.log
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/maven-test.log
          if-no-files-found: ignore

      - name: Fail workflow when tests fail
        if: steps.tests.outcome == 'failure'
        run: exit 1

  build:
    name: Build backend
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build application
        working-directory: ./backend
        run: |
          ./mvnw -B -ntp -q \
            -Dstyle.color=never \
            -DskipTests \
            package
