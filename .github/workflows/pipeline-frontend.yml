name: TaskForge Frontend Pipeline

on:
  push:
    branches:
      - develop
    paths:
        -  frontend/**
        - 'docker-compose.yml'
        - .github/workflows/*-frontend.yml

  pull_request:
    branches:
      - develop
      - main
    paths:
      -  frontend/**
      - 'docker-compose.yml'
      - .github/workflows/*-frontend.yml

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
