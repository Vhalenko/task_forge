services:
  frontend:
    image: vhalenko/taskforge-frontend:1.0.1
    container_name: taskforge-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: vhalenko/taskforge-backend:1.0.1
    container_name: taskforge-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/taskforge
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: default
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: postgres:17
    container_name: taskforge-database
    environment:
      POSTGRES_DB: taskforge
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
          [
            "CMD-SHELL",
            "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
          ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8.8.4
    container_name: taskforge-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
